# Blueprint для Render: разворачивает сервис целиком, включая список переменных.
#
# Зачем файл нужен: на бесплатном плане аккаунт рано или поздно упирается в
# лимиты, и сервис приходится поднимать заново. Собирать при этом полтора
# десятка переменных по памяти — верный способ потерять одну и потом полдня
# искать, почему бот молчит. Здесь перечислены ВСЕ переменные, которые читает
# код (проверено grep'ом по os.environ), с пометкой, какие обязательны.
#
# Как применить на новом аккаунте:
#   Render Dashboard -> New -> Blueprint -> указать этот репозиторий.
#   Render прочитает файл, создаст сервис и спросит значения переменных.
#
# ВАЖНО: sync: false означает "значение задаётся вручную в дашборде".
# Секреты в репозиторий не попадают и попадать не должны — здесь только имена.
services:
  - type: web
    name: dextrade
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    # Бот сам отвечает на GET //health — Render этого достаточно, чтобы
    # считать сервис живым (см. health-check сервер в bot.py).
    healthCheckPath: /
    envVars:
      # --- Обязательные ---------------------------------------------------
      # Токен бота от @BotFather. Без него процесс не стартует.
      - key: TG_BOT_TOKEN
        sync: false

      # Хранилище состояния: вотчлист, настройки, дедуп отправленных находок.
      # Живёт в Upstash, ВНЕ Render, поэтому при переезде данные никуда не
      # деваются — достаточно перенести эти две переменные.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # --- Webhook ---------------------------------------------------------
      # ЛУЧШЕ НЕ ЗАДАВАТЬ ВОВСЕ. Пустое значение теперь означает не
      # long-polling, а "взять адрес этого сервиса из RENDER_EXTERNAL_URL",
      # который Render подставляет сам. Так адрес всегда верный, в том числе
      # после переезда на новый сервис.
      #
      # Задавать вручную стоит только если сервис живёт за своим доменом.
      # Значение от ДРУГОГО сервиса молча ломает приём апдейтов: бот стартует
      # без ошибок, setWebhook проходит, а Telegram шлёт всё на чужой хост.
      # Ровно так и вышло при переезде 2026-08-22 — теперь бот такое
      # расхождение находит сам и пишет в лог ошибку с готовым решением.
      - key: WEBHOOK_BASE_URL
        sync: false
      # Секрет, которым Telegram подписывает запросы к нам. Только буквы,
      # цифры, дефис и подчёркивание, до 256 символов — иначе Telegram
      # отклонит setWebhook (бот это проверяет и скажет в логе).
      - key: TG_WEBHOOK_SECRET
        generateValue: true

      # --- CSFloat ---------------------------------------------------------
      # Ключ из профиля csfloat.com, вкладка developer. Без него арбитраж
      # выключен целиком, остальной бот работает.
      - key: CSFLOAT_API_KEY
        sync: false
      # Резидентные прокси, один или несколько через запятую/пробел. Без них
      # CSFloat отвечает 429 с требованием отключить VPN — датацентровый адрес
      # Render он режет по репутации.
      - key: CSFLOAT_HTTP_PROXY
        sync: false

      # --- Настройки скана (у всех есть значения по умолчанию) -------------
      # Сколько лотов просматривать за прогон. Считается вместе с интервалом:
      # квота CSFloat — 200 запросов в час НА КЛЮЧ (числом прокси не
      # умножается), одна страница = 50 лотов. 1500 лотов раз в 10 минут это
      # 180 запросов в час из 200. Бот проверяет это при старте и предупреждает.
      - key: ARB_TARGET_LISTINGS
        value: "1500"
      # most_recent — свежие лоты; highest_discount — чужой топ по скидке
      # (не рекомендуется, см. комментарий у ARB_SORT_BY в bot.py).
      - key: ARB_SORT_BY
        value: most_recent
      # Интервал автоскана. Считается от бюджета: 10 000 лотов это 200
      # запросов, а лимит CSFloat — 200 запросов в час НА АДРЕС.
      - key: ARB_INTERVAL_MINUTES
        value: "10"

      # --- Слежение за инвентарём (/inv, /invwatch) ------------------------
      # Как часто проверять цены своих скинов. Чаще часа смысла нет: прайс-лист
      # csgotrader на их стороне обновляется примерно раз в час, и более частая
      # проверка сравнивала бы одни и те же числа. Стоит один запрос к Steam за
      # прогон — цены берутся из прайс-листа, уже лежащего в памяти.
      - key: INVENTORY_INTERVAL_MINUTES
        value: "60"
      # Предметы дешевле этого не попадают в отчёт: рост на 30% от десяти
      # центов — это три цента, и такие строки прячут настоящие движения.
      - key: INVENTORY_MIN_PRICE
        value: "0.50"

      # --- Необязательное --------------------------------------------------
      # Куки Steam-сессии: без них бот работает, просто чаще ловит рейт-лимиты.
      - key: STEAM_LOGIN_SECURE
        sync: false
      - key: STEAM_SESSION_ID
        sync: false
      - key: STEAM_BROWSER_ID
        sync: false
      # Прокси для Steam. Не задано — берётся список CSFLOAT_HTTP_PROXY.
      - key: STEAM_HTTP_PROXY
        sync: false
      # Cloudflare Worker как запасной маршрут в CSFloat, если резидентных
      # прокси нет. Формат: https://<имя>.workers.dev
      - key: CSFLOAT_PROXY_URL
        sync: false
      # Тот же воркер для Steam. В рабочей конфигурации не используется.
      - key: STEAM_PROXY_URL
        sync: false
